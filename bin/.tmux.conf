set-window-option -g mode-keys vi

set -g history-limit 100000
set -g mouse on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"

# Inverted-T navigation in copy-mode (i/j/k/l = up/left/down/right).
# Note: this remaps j (now left) and k (now down) away from vim's defaults.
bind -T copy-mode-vi j send -X cursor-up
bind -T copy-mode-vi k send -X cursor-down
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi l send -X cursor-right

# resize-pane by alt + arrow key
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# Keep Claude Code / TUI output from vanishing out of tmux scrollback
set -g alternate-screen off

set -sg escape-time 10
